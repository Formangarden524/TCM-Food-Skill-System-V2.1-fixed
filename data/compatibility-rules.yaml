  description: "中医配伍禁忌与安全性数据，配合药食同源目录使用"

---
# 十八反
# 本草明言十八反，半蒌贝蔹及攻乌，藻戟遂芫俱战草，诸参辛芍叛藜芦

eighteen_contraindications:
  name: "十八反"
  rhyme: "本草明言十八反，半蒌贝蔹及攻乌，藻戟遂芫俱战草，诸参辛芍叛藜芦"
  severity: "致命"
  note: "绝对禁止配伍，可能产生剧毒"
  
  rules:
    - group: "乌头类反半夏、瓜蒌、贝母、白蔹、白及"
      herbs_a: ["乌头", "附子", "天雄", "草乌"]
      herbs_b: ["半夏", "瓜蒌", "贝母", "白蔹", "白及"]
      mechanism: "毒性增强，产生心脏毒性"
      v21_note: "本配方不含乌头类，安全"
      
    - group: "甘草反甘遂、大戟、海藻、芫花"
      herbs_a: ["甘草"]
      herbs_b: ["甘遂", "大戟", "海藻", "芫花"]
      mechanism: "甘草酸与以上成分产生毒性复合物"
      v21_important: "⚠️ 本配方含甘草，需检查以上成分"
      v21_check: "确认配方不含甘遂、大戟、海藻、芫花"
      
    - group: "藜芦反人参、党参、丹参、玄参、苦参、细辛、白芍、赤芍"
      herbs_a: ["藜芦"]
      herbs_b: ["人参", "党参", "丹参", "玄参", "苦参", "细辛", "白芍", "赤芍"]
      mechanism: "增强毒性，可能致命"
      v21_check: "确认配方不含藜芦"

---
# 十九畏
# 硫黄原是火中精，朴硝一见便相争...

nineteen_fears:
  name: "十九畏"
  rhyme: "硫黄原是火中精，朴硝一见便相争。水银莫与砒霜见，狼毒最怕密陀僧。巴豆性烈最为上，偏与牵牛不顺情。丁香莫与郁金见，牙硝难合京三棱。川乌草乌不顺犀，人参最怕五灵脂。官桂善能调冷气，若逢石脂便相欺"
  severity: "高"
  note: "不宜配伍，可能降低药效或产生毒性"
  
  rules:
    - herb: "硫黄"
      fears: "朴硝"
      v21_check: "一般食品不用硫黄"
      
    - herb: "水银"
      fears: "砒霜"
      v21_check: "食品中禁用"
      
    - herb: "狼毒"
      fears: "密陀僧"
      v21_check: "食品中禁用"
      
    - herb: "巴豆"
      fears: "牵牛子"
      v21_check: "巴豆不在药食同源目录"
      
    - herb: "丁香"
      fears: "郁金"
      v21_check: "本配方不含郁金"
      
    - herb: "牙硝"
      fears: "三棱"
      v21_check: "一般食品不用牙硝"
      
    - herb: "川乌、草乌"
      fears: "犀角"
      note: "犀角已禁用，现用水牛角"
      v21_check: "乌头类不在药食同源目录"
      
    - herb: "人参/党参/黄芪"
      fears: "五灵脂"
      v21_important: "⚠️ 本配方含黄芪，需避免五灵脂"
      v21_check: "确认配方不含五灵脂"
      
    - herb: "官桂"
      fears: "赤石脂"
      v21_check: "一般食品不用赤石脂"

