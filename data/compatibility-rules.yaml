# 妊娠禁忌

pregnancy_safety:
  name: "妊娠用药安全"
  note: "孕妇用药需特别谨慎"
  
  categories:
    - level: "绝对禁用"
      risk: "可能导致流产或胎儿畸形"
      herbs:
        - name: "郁李仁"
          reason: "破血润肠，可能导致子宫收缩"
          v21_important: "🔴 本配方含郁李仁，孕妇绝对禁用"
          label_required: "孕妇禁用"
          
        - name: "桃仁"
          reason: "破血祛瘀，堕胎"
          note: "即使V2.1已替换，仍需警惕其他配方"
          
        - name: "红花"
          reason: "活血通经，堕胎"
          v21_alternative: "如需替换桃仁，注意红花也禁用于孕妇"
          
        - name: "西红花（藏红花）"
          reason: "活血力极强，堕胎"
          v21_note: "2019年新增，孕妇禁用"
          
        - name: "三棱"
          reason: "破血行气"
          note: "不在药食同源目录"
          
        - name: "莪术"
          reason: "破血行气"
          note: "不在药食同源目录"
          
        - name: "水蛭"
          reason: "破血逐瘀"
          note: "不在药食同源目录"
          
        - name: "虻虫"
          reason: "破血逐瘀"
          note: "不在药食同源目录"
          
    - level: "慎用"
      risk: "可能影响胎儿，需医师指导"
      herbs:
        - name: "当归"
          reason: "活血，可能动胎气"
          v21_note: "如需替换桃仁，孕妇慎用当归"
          
        - name: "大黄"
          reason: "泻下攻积"
          note: "不在药食同源目录"
          
        - name: "番泻叶"
          reason: "泻下导滞"
          note: "不在药食同源目录"
          
        - name: "芦荟"
          reason: "泻下"
          note: "需控制剂量"
          
    - level: "可用（适量）"
      herbs:
        - name: "山药"
          note: "健脾益肾，安全"
        - name: "大枣"
          note: "补血安神，安全"
        - name: "枸杞"
          note: "滋补肝肾，安全"

