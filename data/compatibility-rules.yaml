# 毒性成分数据库

toxic_components:
  name: "药食同源原料中的毒性成分"
  note: "在限量范围内使用是安全的，但需控制"
  
  herbs_with_toxicity:
    - name: "郁李仁"
      toxic_component: "苦杏仁苷"
      content: "0.5%"
      risk: "水解产生氢氰酸（剧毒）"
      v21_important: "🔴 本配方关键风险点"
      
      hydrolysis_conditions:
        - "温度 > 80℃（酶解）"
        - "酸性环境（胃酸）"
        - "长时间浸泡"
        
      control_measures:
        - "提取温度≤80℃"
        - "添加碳酸钙0.5%中和酸性"
        - "喷雾干燥短时高温（180℃/10s灭活酶）"
        - "饭后服用（减少胃酸作用）"
        
      detection:
        item: "氰化物残留"
        standard: "≤1.0mg/kg"
        method: "GB/T 5009.36"
        frequency: "每批次必检"
        
      symptoms_of_poisoning:
        - "头痛、头晕"
        - "恶心、呕吐"
        - "呼吸困难"
        - "严重者可致死"
        
      emergency_treatment:
        - "立即就医"
        - "洗胃"
        - "亚硝酸钠+硫代硫酸钠解毒"
        
    - name: "苦杏仁（甜杏仁安全）"
      toxic_component: "苦杏仁苷"
      content: "3%（远高于郁李仁）"
      risk: "高毒性"
      note: "甜杏仁含量低（0.1%），可食用"
      v21_check: "确认使用甜杏仁，非苦杏仁"
      
    - name: "甘草"
      toxic_component: "甘草酸"
      content: "2-10%（因产地而异）"
      risk: "假性醛固酮增多症"
      v21_important: "⚠️ 本配方关键控制点"
      
      max_daily_intake:
        glycyrrhizin: "≤100mg/天"
        v21_calculation: "2.5g甘草×5%=125mg/包"
        v21_limit: "每日1包安全，2包需医师指导"
        
      side_effects:
        - "高血压"
        - "低钾血症"
        - "水肿"
        - "头痛"
        
      contraindications:
        - "高血压未控制者"
        - "低钾血症患者"
        - "肾功能不全者"
        - "正在服用利尿剂者"
        - "正在服用地高辛者"
        
      monitoring:
        - "血压（每月）"
        - "血钾（每3个月）"
        - "肌酐（每3个月）"
        
    - name: "何首乌"
      note: "不在本配方中，但常见"
      toxic_component: "蒽醌类"
      risk: "肝损伤"
      note: "生首乌毒性大，制首乌较安全"
      
    - name: "白果"
      toxic_component: "银杏毒素"
      risk: "神经系统毒性"
      limit: "儿童≤10粒/天，成人≤15粒/天"

