---
# 加工费用

processing_costs:
  extraction:
    water_extraction: 15  # 水提，元/kg
    alcohol_extraction: 25  # 醇提，元/kg
    supercritical_co2: 80  # 超临界萃取，元/kg
    
  concentration:
    vacuum_evaporation: 10  # 真空浓缩，元/kg
    
  drying:
    spray_drying: 20  # 喷雾干燥，元/kg
    vacuum_drying: 30  # 真空干燥，元/kg
    freeze_drying: 150  # 冷冻干燥，元/kg
    
  granulation:
    wet_granulation: 8  # 湿法制粒，元/kg
    dry_granulation: 5  # 干法制粒，元/kg
    
  packaging:
    sachet_filling: 0.05  # 袋装，元/包
    canning: 0.10  # 罐装，元/罐
    
  quality_control:
    inspection_fee: 0.03  # 质检分摊，元/包

---
# 检测费用

testing_costs:
  routine_tests:
    sensory: 50      # 感官检测
    moisture: 80    # 水分检测
    total_bacteria: 100  # 菌落总数
    mold_yeast: 80  # 霉菌酵母
    coliform: 100   # 大肠菌群
    subtotal: 410
    
  safety_tests:
    heavy_metals: 600      # 重金属（铅砷镉汞）
    pesticides: 800        # 农残
    aflatoxin: 400         # 黄曲霉毒素
    subtotal: 1800
    
  v21_special_tests:  # V2.1新增必检
    cyanide: 500           # 氰化物（郁李仁）
    glycyrrhizin: 400      # 甘草酸（甘草）
    subtotal: 900
    
  total_per_batch: 3110   # 合计/批次
  
  batch_size_example: 5000  # 假设5000包/批次
  cost_per_pack: 0.622      # 分摊到每包

---
# 完整成本核算示例（枣仁安神颗粒 V2.1）

cost_example:
  product: "枣仁安神颗粒"
  version: "V2.1"
  batch_size: 5000  # 包
  pack_size: 3  # g/包
  
  raw_materials:
    - item: "酸枣仁"
      dosage_per_pack: 0.45  # g
      price_per_kg: 80
      cost_per_pack: 0.036
      
    - item: "郁李仁"
      dosage_per_pack: 0.24
      price_per_kg: 60
      cost_per_pack: 0.014
      note: "V2.1替换桃仁，成本更低"
      
    - item: "黄芪"
      dosage_per_pack: 0.45
      price_per_kg: 50
      cost_per_pack: 0.023
      
    - item: "陈皮"
      dosage_per_pack: 0.09
      price_per_kg: 50
      cost_per_pack: 0.005
      note: "V2.1减至3g，成本降低"
      
    - item: "山楂"
      dosage_per_pack: 0.30
      price_per_kg: 16
      cost_per_pack: 0.005
      
    - item: "甘草"
      dosage_per_pack: 0.075
      price_per_kg: 20
      cost_per_pack: 0.002
      note: "V2.1减至2.5g，成本降低"
      
    - item: "碳酸钙"
      dosage_per_pack: 0.015
      price_per_kg: 5
      cost_per_pack: 0.0001
      note: "V2.1新增"
      
    - item: "其他辅料"
      cost_per_pack: 0.077
      
    subtotal: 0.162
    
  processing:
    extraction: 0.045
    drying: 0.060
    granulation: 0.024
    packaging: 0.058
    qc: 0.015
    subtotal: 0.202
    
  testing:
   分摊: 0.622
    
  other:
    transport: 0.150
    loss_3pct: 0.011
    contingency_5pct: 0.057
    subtotal: 0.218
    
  total_cost_per_pack: 1.204
  
  pricing:
    factory_price: 2.00  # 出厂价，毛利40%
    retail_price: 3.50   # 零售价，建议3-4元/包
    
  annual_projection:
    monthly_sales: 10000  # 包
    annual_sales: 120000
    annual_revenue: 420000  # 按零售价3.5元
    annual_cost: 144480   # 按成本1.2元
    annual_profit: 275520
    
  v21_cost_optimization:
    - "郁李仁替换桃仁，原料成本↓0.03元/包"
    - "陈皮从6g减至3g，原料成本↓0.003元/包"
    - "甘草从3g减至2.5g，原料成本↓0.001元/包"
    - "碳酸钙增加0.0001元/包（必要安全投入）"
    - "合计节省: 0.034元/包（约3%）"

---
# 成本敏感性分析

sensitivity_analysis:
  factors:
    - factor: "酸枣仁价格上涨20%"
      impact: "+0.007元/包"
      mitigation: "提前储备3个月库存"
      
    - factor: "郁李仁价格上涨20%"
      impact: "+0.003元/包"
      mitigation: "寻找多家供应商"
      
    - factor: "检测费用增加"
      impact: "+0.1元/包（如增加全检频次）"
      mitigation: "合理规划检测批次"
      
    - factor: "代工费上涨10%"
      impact: "+0.02元/包"
      mitigation: "签订长期合作协议"
      
  overall_impact:
    worst_case: "+15%成本（约+0.18元/包）"
    best_case: "-10%成本（约-0.12元/包）"

---
# 供应商管理建议

supplier_management:
  strategy: "3+1策略"
  description: "3家主供应商+1家备用供应商"
  
  selection_criteria:
    - "持有GMP证书"
    - "有药食同源原料生产经验"
    - "能提供质检报告（COA）"
    - "价格合理"
    - "交货及时"
    
  audit_frequency: "每年1次现场审计"
  
  key_suppliers_recommended:
    酸枣仁:
      regions: ["河北邢台", "山西晋城", "陕西延安"]
      
    郁李仁:
      regions: ["黑龙江", "内蒙古"]
      note: "V2.1新增采购需求"
      
    黄芪:
      regions: ["山西浑源", "内蒙古武川"]
      note: "恒山黄芪最佳"
      
  cost_saving_tips:
    - "秋季产新时大量采购，锁定低价"
    - "与供应商签订年度协议，获取折扣"
    - "联合其他产品共同采购，增加议价能力"
    - "建立原料储备，应对价格波动"
